<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>=LOVE コール練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero"><div class="wrap">
  <h1><span class="eq">=LOVE</span><br>コール練習</h1>
  <p>曲を選んで、コールを覚えよう。</p>
  <input id="q" type="search" placeholder="曲名で探す" aria-label="曲名で探す">
</div></header>
<main class="wrap" id="list"></main>
<footer>非公式のファン練習サイトです</footer>
<script src="songs.js"></script>
<script>
var list = document.getElementById("list"), links = [], cards = [];
function link(cls, s){
  var a = document.createElement("a");
  a.className = cls + (SONG_DATA[s.id] ? " ready" : "");
  a.href = "song.html?id=" + s.id; a.textContent = s.title;
  a.dataset.t = s.title.toLowerCase(); links.push(a); return a;
}
SINGLES.forEach(function(sg){
  var card = document.createElement("section"); card.className = "single";
  var no = document.createElement("span"); no.className = "no"; no.textContent = sg.no + "th";
  if(sg.no===1) no.textContent="1st"; if(sg.no===2) no.textContent="2nd"; if(sg.no===3) no.textContent="3rd"; if(sg.no===21) no.textContent="21st";
  card.appendChild(no);
  ALL.filter(function(s){return s.no===sg.no && s.kind==="main"}).forEach(function(s){ card.appendChild(link("main", s)); });
  var lab = document.createElement("div"); lab.className = "lab"; lab.textContent = "カップリング"; card.appendChild(lab);
  var chips = document.createElement("div"); chips.className = "chips";
  ALL.filter(function(s){return s.no===sg.no && s.kind==="sub"}).forEach(function(s){ chips.appendChild(link("chip", s)); });
  card.appendChild(chips); list.appendChild(card); cards.push(card);
});
document.getElementById("q").oninput = function(e){
  var q = e.target.value.trim().toLowerCase();
  links.forEach(function(a){ a.hidden = q && a.dataset.t.indexOf(q) < 0; });
  cards.forEach(function(c){
    c.hidden = !Array.prototype.some.call(c.querySelectorAll("a"), function(a){return !a.hidden});
    c.querySelector(".lab").hidden = !c.querySelectorAll(".chip:not([hidden])").length;
  });
};
</script>
</body>
</html>
